[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brliant_calc"
version = "4.2.0"
description = "A powerful CLI scientific calculator built for speed."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Aarav Maloo", email = "aaravmaloo06@gmail.com"}
]
keywords = ["calculator", "scientific", "mathematics", "cli", "symbolic", "matrix", "physics", "number-theory", "combinatorics", "geometry", "finance", "signal-processing", "calculus"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Utilities",
]

dependencies = [
    "numpy>=1.20.0",
    "sympy>=1.10.0",
    "matplotlib>=3.3.0",
    "pint>=0.18.0",
    "currency-converter>=0.5.0",
    "scipy>=1.7.0",
    "prompt-toolkit>=3.0.0",
    "rich>=10.0.0",
    "pygments>=2.0.0",
    "build>=1.4.4",
]

[project.urls]
Homepage = "https://github.com/aaravmaloo/brliant_calc"
Repository = "https://github.com/aaravmaloo/brliant_calc"
"Bug Tracker" = "https://github.com/aaravmaloo/brliant_calc/issues"

[project.scripts]
brliant_calc = "brliant_calc.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brliant_calc*"]
exclude = ["tests*", "docs*"]
